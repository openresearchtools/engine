name: Release All
run-name: Release All - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag override (example: v1.12). Leave empty to auto-increment v1.x."
        required: false
        default: ""
      title:
        description: Optional release title override.
        required: false
        default: ""
      carry_forward_release_tag:
        description: "Earlier release containing Windows/macOS assets. Empty selects the latest earlier release."
        required: false
        default: ""
      prerelease:
        description: Mark release as prerelease
        required: false
        type: boolean
        default: false

concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  resolve-release-meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      package_version: ${{ steps.meta.outputs.package_version }}
      carry_forward_release_tag: ${{ steps.meta.outputs.carry_forward_release_tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          input_tag='${{ inputs.tag }}'
          if [[ -n "$input_tag" ]]; then
            tag="$input_tag"
          else
            git fetch --tags --force
            last_minor="$(git tag -l 'v1.*' | sed -n 's/^v1\.\([0-9]\+\)$/\1/p' | sort -n | tail -n1)"
            next_minor=$(( ${last_minor:- -1} + 1 ))
            tag="v1.$next_minor"
          fi

          input_title='${{ inputs.title }}'
          title="${input_title:-Openresearchtools-Engine $tag}"
          package_version="${tag#v}"
          package_version="$(printf '%s' "$package_version" | sed 's/[^0-9A-Za-z.+:~-]/~/g')"
          [[ "$package_version" =~ ^[0-9] ]] || package_version="0~$package_version"

          carry_tag='${{ inputs.carry_forward_release_tag }}'
          if [[ -z "$carry_tag" ]]; then
            carry_tag="$(gh release list --limit 50 --json tagName,isDraft --jq ".[] | select(.isDraft == false and .tagName != \"$tag\") | .tagName" | head -n1)"
          fi
          [[ -n "$carry_tag" ]] || {
            echo "No earlier release was found. Set carry_forward_release_tag explicitly." >&2
            exit 1
          }
          gh release view "$carry_tag" >/dev/null

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "carry_forward_release_tag=$carry_tag" >> "$GITHUB_OUTPUT"
          echo "Linux package version: $package_version"
          echo "Carrying Windows/macOS assets from: $carry_tag"

  build-linux-debs:
    needs: resolve-release-meta
    uses: ./.github/workflows/linux-x64-deb.yml
    with:
      package_version: ${{ needs.resolve-release-meta.outputs.package_version }}
    secrets: inherit

  publish-release:
    needs: [resolve-release-meta, build-linux-debs]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.resolve-release-meta.outputs.tag }}
      RELEASE_TITLE: ${{ needs.resolve-release-meta.outputs.title }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      CARRY_FORWARD_TAG: ${{ needs.resolve-release-meta.outputs.carry_forward_release_tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: engine-linux-deb-*
          path: linux-artifacts
          merge-multiple: true

      - name: Carry forward Windows and macOS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p carried-assets
          patterns=(
            '*windows-x64*.zip'
            '*macos-arm64*.zip'
            'Engine.exe'
            'Engine.dmg'
          )
          for pattern in "${patterns[@]}"; do
            gh release download "$CARRY_FORWARD_TAG" \
              --repo "$GH_REPO" \
              --pattern "$pattern" \
              --dir carried-assets || true
          done
          find carried-assets -maxdepth 1 -type f -print
          find carried-assets -maxdepth 1 -type f -name '*windows-x64-vulkan.zip' -print -quit | grep -q . || {
            echo "The source release has no Windows Vulkan runtime." >&2
            exit 1
          }
          find carried-assets -maxdepth 1 -type f -name '*windows-x64-cuda.zip' -print -quit | grep -q . || {
            echo "The source release has no Windows CUDA runtime." >&2
            exit 1
          }
          find carried-assets -maxdepth 1 -type f -name '*macos-arm64-metal.zip' -print -quit | grep -q . || {
            echo "The source release has no macOS Metal runtime." >&2
            exit 1
          }
          test -f carried-assets/Engine.exe
          test -f carried-assets/Engine.dmg

      - name: Assemble release assets and runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp linux-artifacts/engine-amd64.deb release-assets/engine-amd64.deb
          cp linux-artifacts/engine-amd64-cuda.deb release-assets/engine-amd64-cuda.deb
          cp -a carried-assets/. release-assets/
          for previous in carried-assets/*; do
            name="$(basename "$previous")"
            cmp --silent "$previous" "release-assets/$name" || {
              echo "Carried-forward asset changed while assembling release: $name" >&2
              exit 1
            }
          done
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

          RELEASE_ASSETS="$PWD/release-assets" python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ["RELEASE_ASSETS"])
          repo = os.environ["GH_REPO"]
          tag = os.environ["RELEASE_TAG"]

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          assets = []
          for path in sorted(root.iterdir()):
              name = path.name
              if name == "SHA256SUMS.txt":
                  continue
              metadata = None
              if name == "engine-amd64.deb":
                  metadata = ("linux-x64-vulkan", "linux-x64", "vulkan", "deb")
              elif name == "engine-amd64-cuda.deb":
                  metadata = ("linux-x64-cuda", "linux-x64", "cuda", "deb")
              elif "windows-x64-vulkan" in name:
                  metadata = ("windows-x64-vulkan", "windows-x64", "vulkan", "zip")
              elif "windows-x64-cuda" in name:
                  metadata = ("windows-x64-cuda", "windows-x64", "cuda", "zip")
              elif "macos-arm64-metal" in name:
                  metadata = ("macos-arm64-metal", "macos-arm64", "metal", "zip")
              if metadata is None:
                  continue
              asset_id, platform, backend, archive = metadata
              assets.append({
                  "id": asset_id,
                  "platform": platform,
                  "backend": backend,
                  "archive": archive,
                  "file_name": name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": sha256(path),
              })

          manifest = {
              "schema_version": 1,
              "project": "Openresearchtools-Engine",
              "repository": repo,
              "tag": tag,
              "non_linux_assets_carried_forward_from": os.environ["CARRY_FORWARD_TAG"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "release_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "assets": assets,
          }
          (root / "engine-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          {
            echo "# $RELEASE_TITLE"
            echo
            echo "Linux is the only platform built for this release. Windows and macOS assets are unchanged copies from \`$CARRY_FORWARD_TAG\`."
            echo
            echo "## Linux x64 Debian packages"
            echo
            echo "| Backend | Debian package | File |"
            echo "|---|---|---|"
            echo "| CPU + Vulkan | \`openresearchtools-engine\` | [\`engine-amd64.deb\`]($base_url/engine-amd64.deb) |"
            echo "| CPU + CUDA | \`openresearchtools-engine-cuda\` | [\`engine-amd64-cuda.deb\`]($base_url/engine-amd64-cuda.deb) |"
            echo
            echo "Both packages are co-installable. Their runtime roots are \`/opt/openresearchtools/engine/vulkan\` and \`/opt/openresearchtools/engine/cuda\`."
            echo "The CUDA package includes the redistributable CUDA runtime libraries, NVIDIA CUDA EULA, and NVIDIA runtime notice. The host NVIDIA driver remains a system requirement."
            echo
            echo "## Carried-forward desktop assets"
            echo
            for asset in carried-assets/*; do
              name="$(basename "$asset")"
              echo "- [\`$name\`]($base_url/$name)"
            done
          } > release-notes.md

      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$RELEASE_PRERELEASE" == true ]]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" \
              --title "$RELEASE_TITLE" --notes-file release-notes.md "${prerelease_args[@]}"
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" --notes-file release-notes.md "${prerelease_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" --repo "$GH_REPO" release-assets/* --clobber
